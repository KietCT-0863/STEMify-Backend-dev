  emulator-service:
    image: rosie91/stemify:emulator-service
    build:
      context: .
      dockerfile: src/Services/EmulatorService/Emulator.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Url=${RABBITMQ_URL}
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:5009
      # MongoDB configuration
      - ConnectionStrings__emulator-mongodb=mongodb://root:mongopw@mongo
      - MongoDb__DatabaseName=stemify_emulator
      # Redis configuration
      - RedisConfig__Host=redis
      - RedisConfig__Port=6379
      - RedisConfig__Password=secret
      - RedisConfig__Ssl=false
      # gRPC endpoints
      - GrpcIdentityUrl=http://identity-api-service:5002
      - GrpcResourceUrl=http://resource-service:5003
      # OpenTelemetry Configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcollector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=emulator-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=emulator-service,service.version=1.0.0
      # Cloudinary Configuration
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    ports:
      - 7009:80
      - 5009:5009
    depends_on:
      - redis
      - otelcollector
      #- rabbitmq
    restart: unless-stopped

  # ========================================
  # MONITORING STACK
  # ========================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: stemify-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-otlp-receiver'
    restart: unless-stopped

  # AlertManager - Alert Management
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: stemify-alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: stemify-grafana
    ports:
      - '3001:3001'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/config:/etc/grafana:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - PROMETHEUS_ENDPOINT=http://prometheus:9090
    restart: unless-stopped
    depends_on:
      - prometheus

  # OpenTelemetry Collector
  otelcollector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: stemify-otelcollector
    ports:
      - '8888:8888' # Prometheus metrics
      - '8889:8889' # Prometheus exporter
      - '4317:4317' # OTLP gRPC receiver
      - '4318:4318' # OTLP HTTP receiver
    volumes:
      - ./config/otelcollector:/etc/otelcol-contrib:ro
    environment:
      - PROMETHEUS_ENDPOINT=http://prometheus:9090/api/v1/write
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    restart: unless-stopped
    depends_on:
      - prometheus

  # ========================================
  # AI SERVICE & VECTOR DATABASE
  # ========================================

  # Qdrant - Vector Database for RAG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: stemify-qdrant
    ports:
      - '6333:6333' # HTTP API
      - '6334:6334' # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20
    container_name: stemify-neo4j
    ports:
      - '7474:7474' # HTTP
      - '7687:7687' # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', 'password', 'RETURN 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  ai-service:
    image: rosie91/stemify:ai-service
    build:
      context: ./src/Services/AIService
      dockerfile: Dockerfile
    environment:
      - PORT=80
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - RESOURCE_GRPC_CERT_PATH=${RESOURCE_GRPC_CERT_PATH}
    ports:
      - '7010:80'
      - '5010:5010' # gRPC
    # depends_on:
    #   - qdrant
    #   - neo4j
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis-data:
  postgres_data:
  mongodata:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
