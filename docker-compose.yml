      - EmailSettings__DisplayName=${IDENTITY_EMAIL_DISPLAY_NAME}
      - EmailSettings__SMTPServer=${IDENTITY_EMAIL_SMTP_SERVER}
      - EmailSettings__Port=${IDENTITY_EMAIL_PORT}
      - EmailSettings__Username=${IDENTITY_EMAIL_USERNAME}
      - EmailSettings__Password=${IDENTITY_EMAIL_PASSWORD}
      - EmailSettings__UseSSL=${IDENTITY_EMAIL_USE_SSL}
      - EmailSettings__ApplicationName=${IDENTITY_EMAIL_APP_NAME}
      - EmailSettings__SupportEmail=${IDENTITY_EMAIL_SUPPORT}
      # Google Authentication
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__Google__RedirectUri=${GOOGLE_REDIRECT_URI}
      # OpenTelemetry Configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcollector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=identity-api-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=identity-api-service,service.version=1.0.0
      - GrpcServices__OrderService__Address=http://order-service:5006
      # Google Authentication
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__Google__RedirectUri=${GOOGLE_REDIRECT_URI}
      - BackendUrl=${IDENTITY_BACKEND_URL:-http://localhost:6001}
    ports:
      - 7002:80
      - 5002:5002
    depends_on:
      - postgres
      - otelcollector
    restart: unless-stopped
  identity-service:
    image: rosie91/stemify:identity-service
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__stemifyidentity=Server=postgres:5432;User Id=postgres;Password=${DB_PASSWORD};Database=stemify_identity
      # OpenIddict configuration for Docker
      - OpenIddict__Issuer=${OPENIDDICT_ISSUER:-https://api.stemify.site}
      - OpenIddict__Authority=${OPENIDDICT_ISSUER:-https://api.stemify.site}
      - OpenIddict__SigningKey=${OPENIDDICT_SIGNING_KEY}
      - OpenIddict__EncryptionKey=${OPENIDDICT_ENCRYPTION_KEY}
      - OpenIddict__ApiClientSecret=${OPENIDDICT_API_CLIENT_SECRET}
      - OpenIddict__ForceRecreateClients=${OPENIDDICT_FORCE_RECREATE_CLIENTS:-true}
      - OpenIddict__DisableHttpsRequirement=${OPENIDDICT_DISABLE_HTTPS:-true}
      # CORS for Docker environment
      - Cors__Origins=${IDENTITY_CORS_ORIGINS:-https://localhost:3000,https://ste-mify-frontend-dev.vercel.app,https://stemify.site}
      - ClientApp=${IDENTITY_CLIENT_APP:-https://localhost:3000,https://ste-mify-frontend-dev.vercel.app,https://stemify.site}
      - BackendUrl=${IDENTITY_BACKEND_URL:-https://stemify.site}
      # Google Authentication
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__Google__RedirectUri=${GOOGLE_REDIRECT_URI}
      # Email Settings
      - EmailSettings__SMTPServer=${IDENTITY_EMAIL_SMTP_SERVER}
      - EmailSettings__Port=${IDENTITY_EMAIL_PORT}
      - EmailSettings__UseSSL=${IDENTITY_EMAIL_USE_SSL}
      - EmailSettings__Username=${IDENTITY_EMAIL_USERNAME}
      - EmailSettings__Password=${IDENTITY_EMAIL_PASSWORD}
      - EmailSettings__From=${IDENTITY_EMAIL_FROM}
      - EmailSettings__DisplayName=${IDENTITY_EMAIL_DISPLAY_NAME}
      - EmailSettings__ApplicationName=${IDENTITY_EMAIL_APP_NAME}
      - EmailSettings__SupportEmail=${IDENTITY_EMAIL_SUPPORT}
      - EmailSettings__Enabled=${IDENTITY_EMAIL_ENABLED}
      - EmailSettings__EnableVerification=${IDENTITY_EMAIL_ENABLE_VERIFICATION}
      - EmailSettings__TimeoutMs=${IDENTITY_EMAIL_TIMEOUT_MS}
      - EmailSettings__MaxRetryAttempts=${IDENTITY_EMAIL_MAX_RETRY}
      - EmailSettings__LogEmailContent=${IDENTITY_EMAIL_LOG_CONTENT}
      # gRPC Services
      - GrpcServices__OrderService__Address=http://order-service:5006
      # Database Options
      - DatabaseOptions__MaxRetryCount=5
      - DatabaseOptions__MaxRetryDelay=00:00:10
      - DatabaseOptions__CommandTimeout=30
      - DatabaseOptions__EnableRetryOnFailure=true
      - DatabaseOptions__EnableSensitiveDataLogging=${DB_ENABLE_SENSITIVE_LOGGING}
      - DatabaseOptions__EnableDetailedErrors=${DB_ENABLE_DETAILED_ERRORS}
      # OpenTelemetry Configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcollector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=identity-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=identity-service,service.version=1.0.0
      - RabbitMq__Url=${RABBITMQ_URL}
    ports:
      - 5000:80
    depends_on:
      - postgres
      - otelcollector
    restart: unless-stopped
