services:
  postgres:
    image: postgres:17
    container_name: stemify-postgres
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongopw
    ports:
      - 27018:27017
    volumes:
      - mongodata:/var/lib/mongodb/data
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=root
      - HTTP_PASSWORD=secret
    ports:
      - 8082:8082
    depends_on:
      - redis
  classroom-service:
    image: rosie91/stemify:classroom-service
    build:
      context: .
      dockerfile: src/Services/ClassroomService/Classroom.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Url=${RABBITMQ_URL}
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:5001
      - RedisConfig__Host=redis
      - RedisConfig__Port=6379
      - RedisConfig__Password=secret
      - RedisConfig__Ssl=false
      - GrpcResourceUrl=http://resource-service:5003
      - GrpcIdentityUrl=http://identity-api-service:5002
      - GrpcOrderUrl=http://order-service:5006
      - ConnectionStrings__stemifyclassroom=Server=postgres:5432;User Id=postgres;Password=${DB_PASSWORD};Database=stemify_classroom
      # OpenTelemetry Configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcollector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=classroom-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=classroom-service,service.version=1.0.0
      # Cloudinary Configuration
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - Pdflayer__ApiKey=e4a39484d4c94acacd0da61ba5970b09
    ports:
      - 7001:80
      - 5001:5001
    depends_on:
      - postgres
      - otelcollector
      #- rabbitmq
    restart: unless-stopped
  resource-service:
    image: rosie91/stemify:resource-service
    build:
      context: .
      dockerfile: src/Services/Resource/Resource.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Url=${RABBITMQ_URL}
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:5003
      - ConnectionStrings__stemifyresource=Server=postgres:5432;User Id=postgres;Password=${DB_PASSWORD};Database=stemify_resource
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - RedisConfig__Host=redis
      - RedisConfig__Port=6379
      - RedisConfig__Password=secret
      - RedisConfig__Ssl=false
      - GrpcIdentityUrl=http://identity-api-service:5002
      - GrpcEmulatorUrl=http://emulator-service:5009
      - ClientApp=https://localhost:3000,https://ste-mify-frontend-dev.vercel.app,https://stemify.site
      - Gemini__BaseUrl=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=gemini-2.5-flash
      # OpenTelemetry Configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcollector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=resource-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=resource-service,service.version=1.0.0
    ports:
      - 7003:80
      - 5003:5003
    depends_on:
      - postgres
      - otelcollector
      #- rabbitmq
    restart: unless-stopped
  product-service:
    image: rosie91/stemify:product-service
    build:
