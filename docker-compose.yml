      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=product-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=product-service,service.version=1.0.0
    ports:
      - 7005:80
      - 5005:5005
    depends_on:
      - postgres
      - otelcollector
      #- rabbitmq
    restart: unless-stopped
  order-service:
    image: rosie91/stemify:order-service
    build:
