syntax = "proto3";

option csharp_namespace = "Emulator.API.Protos";

package template;

import "google/api/annotations.proto";

// Template management service for component and material templates
service TemplateService {
  // Component Template Operations
  rpc CreateComponentTemplate (CreateComponentTemplateRequest) returns (ComponentTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/templates/components"
      body: "*"
    };
  }
  rpc GetComponentTemplate (GetTemplateRequest) returns (ComponentTemplateResponse) {
    option (google.api.http) = {
      get: "/v1/templates/components/{id}"
    };
  }
  rpc ListComponentTemplates (ListComponentTemplatesRequest) returns (ComponentTemplateListResponse) {
    option (google.api.http) = {
      get: "/v1/templates/components"
    };
  }
  rpc UpdateComponentTemplate (UpdateComponentTemplateRequest) returns (OperationResponse) {
    option (google.api.http) = {
      put: "/v1/templates/components/{template_id}"
      body: "*"
    };
  }
  rpc DeleteComponentTemplate (DeleteTemplateRequest) returns (OperationResponse) {
    option (google.api.http) = {
      delete: "/v1/templates/components/{id}"
    };
  }

  // Material Template Operations
  rpc CreateMaterialTemplate (CreateMaterialTemplateRequest) returns (MaterialTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/templates/materials"
      body: "*"
    };
  }
  rpc GetMaterialTemplate (GetTemplateRequest) returns (MaterialTemplateResponse) {
    option (google.api.http) = {
      get: "/v1/templates/materials/{id}"
    };
  }
  rpc ListMaterialTemplates (ListMaterialTemplatesRequest) returns (MaterialTemplateListResponse) {
    option (google.api.http) = {
      get: "/v1/templates/materials"
    };
  }
  rpc UpdateMaterialTemplate (UpdateMaterialTemplateRequest) returns (OperationResponse) {
    option (google.api.http) = {
      put: "/v1/templates/materials/{material_id}"
      body: "*"
    };
  }
  rpc DeleteMaterialTemplate (DeleteTemplateRequest) returns (OperationResponse) {
    option (google.api.http) = {
      delete: "/v1/templates/materials/{id}"
    };
  }

  // Batch Operations
  rpc GetTemplatesByIds (GetTemplatesByIdsRequest) returns (TemplatesBatchResponse);
  rpc ValidateTemplateReferences (ValidateTemplateReferencesRequest) returns (ValidationResponse);

  // Utility
  rpc ImportTemplatesFromOctahedron (ImportTemplatesRequest) returns (ImportTemplatesResponse);
}

// ============================================
// Component Template Messages
// ============================================

message CreateComponentTemplateRequest {
  string template_id = 1;
  string type = 2;
  string version = 3;
  string definition_json = 4; // JSON string of definition
  optional string name = 5;
  optional string description = 6;
  repeated string tags = 7;
  optional string created_by = 8;
  optional string organization_id = 9;
}

message UpdateComponentTemplateRequest {
  string template_id = 1;
  optional string definition_json = 2; // JSON string of definition
  optional string name = 3;
  optional string description = 4;
  repeated string tags = 5;
  optional bool is_published = 6;
}

message ComponentTemplateResponse {
  bool success = 1;
  optional string error_message = 2;
  optional ComponentTemplate template = 3;
}

message ComponentTemplate {
  string id = 1;
  string template_id = 2;
  string type = 3;
  string version = 4;
  string name = 5;
  string description = 6;
  string definition_json = 7; // JSON string of definition
  repeated string tags = 8;
  optional string thumbnail_url = 9;
  bool is_published = 10;
  optional string created_by = 11;
  optional string organization_id = 12;
  string created_at = 13;
  string updated_at = 14;
  optional string cdn_url = 15;
  int32 usage_count = 16;
}

message ListComponentTemplatesRequest {
  optional string type = 1;
  repeated string tags = 2;
  int32 skip = 3;
  int32 limit = 4;
}

message ComponentTemplateListResponse {
  bool success = 1;
  optional string error_message = 2;
  repeated ComponentTemplate templates = 3;
  int32 total = 4;
}

// ============================================
// Material Template Messages
// ============================================

message CreateMaterialTemplateRequest {
  string material_id = 1;
  string version = 2;
  string definition_json = 3; // JSON string of definition
  optional string name = 4;
  optional string description = 5;
  repeated string tags = 6;
  optional string created_by = 7;
  optional string organization_id = 8;
}

message UpdateMaterialTemplateRequest {
  string material_id = 1;
  optional string definition_json = 2; // JSON string of definition
  optional string name = 3;
  optional string description = 4;
  repeated string tags = 5;
  optional bool is_published = 6;
}

message MaterialTemplateResponse {
  bool success = 1;
  optional string error_message = 2;
  optional MaterialTemplate template = 3;
}

message MaterialTemplate {
  string id = 1;
  string material_id = 2;
  string version = 3;
  string name = 4;
  string description = 5;
  string definition_json = 6; // JSON string of definition
  repeated string tags = 7;
  optional string thumbnail_url = 8;
  bool is_published = 9;
  optional string created_by = 10;
  optional string organization_id = 11;
  string created_at = 12;
  string updated_at = 13;
  optional string cdn_url = 14;
  int32 usage_count = 15;
}

message ListMaterialTemplatesRequest {
  repeated string tags = 1;
  int32 skip = 2;
  int32 limit = 3;
}

message MaterialTemplateListResponse {
  bool success = 1;
  optional string error_message = 2;
  repeated MaterialTemplate templates = 3;
  int32 total = 4;
}

// ============================================
// Common Messages
// ============================================

message GetTemplateRequest {
  string id = 1; // template_id or material_id
}

message DeleteTemplateRequest {
  string id = 1; // template_id or material_id
}

message OperationResponse {
  bool success = 1;
  optional string error_message = 2;
}

message GetTemplatesByIdsRequest {
  repeated string component_template_ids = 1;
  repeated string material_template_ids = 2;
}

message TemplatesBatchResponse {
  bool success = 1;
  optional string error_message = 2;
  repeated ComponentTemplate component_templates = 3;
  repeated MaterialTemplate material_templates = 4;
}

message ValidateTemplateReferencesRequest {
  repeated string component_template_ids = 1;
  repeated string material_template_ids = 2;
}

message ValidationResponse {
  bool is_valid = 1;
  repeated string missing_template_ids = 2;
  optional string error_message = 3;
}

message ImportTemplatesRequest {
  string octahedron_json = 1; // Full octahedron.json as string
  optional string created_by = 2;
}

message ImportTemplatesResponse {
  bool success = 1;
  optional string error_message = 2;
  int32 component_count = 3;
  int32 material_count = 4;
}
