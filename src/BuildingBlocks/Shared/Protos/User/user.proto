syntax = "proto3";

option csharp_namespace = "Shared.Protos.User";

import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";

package user;

service GrpcUser{
    rpc GetUserById (GetUserRequest) returns (GrpcUserResponse) {
        option (google.api.http) = {
            get: "/api/users/{id}"
        };
    }
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse) {
        option (google.api.http) = {
            post: "/api/users"
            body: "*"
        };
    }
    rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse) {
        option (google.api.http) = {
            patch: "/api/users/{id}"
            body: "*"
        };
    }
    rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse) {
        option (google.api.http) = {
            delete: "/api/users/{id}"
        };
    }
    rpc QueryUsers (QueryUsersRequest) returns (PagedUserList) {
        option (google.api.http) = {
            get: "/api/users"
        };
    }
    rpc CheckUserExists (CheckUserExistsRequest) returns (CheckUserExistsResponse) {
        option (google.api.http) = {
            get: "/api/users/exists"
        };
    }
    rpc CheckUserIdExists (CheckUserIdExistsRequest) returns (CheckUserExistsResponse) {
        option (google.api.http) = {
            get: "/api/users/ids/exists"
        };
    }
    rpc EnsureUsersExist (EnsureUsersRequest) returns (CheckUserExistsResponse) {
        option (google.api.http) = {
            post: "/api/users/ensure"
            body: "*"
        };
    }
    
    rpc SearchUsers (SearchUsersRequest) returns (PagedUserList) {
        option (google.api.http) = {
            get: "/api/users/search"
        };
    }
    rpc GetOrganizationAdmins (GetOrganizationAdminsRequest) returns (GetOrganizationAdminsResponse) {
        option (google.api.http) = {
            get: "/api/organizations/{organization_id}/admins"
        };
    }
    rpc GetOrganizationUsers (GetOrganizationUsersRequest) returns (PagedOrganizationUserList) {
        option (google.api.http) = {
            get: "/api/organizations/{organization_id}/users"
        };
    }
    rpc GetOrganizationUserById (GetOrganizationUserByIdRequest) returns (OrganizationUserInfo) {
        option (google.api.http) = {
            get: "/api/organization-users/{organization_user_id}"
        };
    }
    rpc GetOrganizationUser (GetOrganizationUserRequest) returns (OrganizationUserModel) {
        option (google.api.http) = {
            get: "/api/organization-users"
        };
    }
    rpc GetUserByOrganizationUserId (GetOrganizationUserByIdRequest) returns (GrpcUserResponse) {
        option (google.api.http) = {
            get: "/api/organization-users/{organization_user_id}/user"
        };
    }
    rpc GetOrganizationUsersByUserId (GetOrganizationUsersByUserIdRequest) returns (PagedOrganizationUserList) {
        option (google.api.http) = {
            get: "/api/users/{user_id}/organizations"
        };
    }
}

message GrpcUserResponse {
	string userId = 1;
	string email = 2;
    string userName = 3;
	string firstName = 4;
	string lastName = 5;
    string userRole = 6;
	google.protobuf.StringValue imageUrl = 7;
    string status = 8;
    int32 organization_id = 9;
	string name = 10;
}

message CheckUserExistsRequest {
	repeated string emails = 1;
}

message CheckUserIdExistsRequest {
	repeated string userIds = 1;
}

message CheckUserExistsResult {
    string userId = 1;
    string email = 2;
}

message CheckUserExistsResponse {
    repeated CheckUserExistsResult results = 1;
}
message EnsureUsersRequest {
    repeated string emails = 1;
}

message GetUserRequest {
	string id = 1;
}

message UpdateUserRequest {
    string id = 1;
    google.protobuf.StringValue userRole = 2;
    google.protobuf.StringValue firstName = 3; 
    google.protobuf.StringValue lastName = 4;  
    google.protobuf.StringValue status = 5;
    google.protobuf.StringValue password = 6;
}

message UpdateUserResponse {
    bool isSuccess = 1;
}

message DeleteUserRequest {
    string id = 1;
}

message DeleteUserResponse {
    bool isSuccess = 1;
}

message CreateUserRequest {
    string email = 1;
    string userName = 2;
    string password = 3;
    string userRole = 4;
    string firstName = 5;
    string lastName = 6;
}

message CreateUserResponse {
	string userId = 1;
}

message QueryUsersRequest {
    int32 pageNumber = 1;
    int32 pageSize = 2;
    string search = 3;
    string role = 4;
    string status = 5;
}

message PagedUserList {
    repeated GrpcUserResponse items = 1;
    int32 totalCount = 2;
    int32 pageNumber = 3;
    int32 pageSize = 4;
    int32 totalPages = 5;
}

enum UserRole {
    GUEST = 0;
    STUDENT = 1;
    TEACHER = 2;
    STAFF = 3;
    ADMIN = 4;
}

enum UserStatus {
    STATUS_UNSPECIFIED = 0;
    PENDING = 1;
    ACTIVE =2;
    DISABLED = 3;
    DELETED = 4;
    LOCKED = 5;
}



message SearchUsersRequest {
    int32 subscription_order_id = 1;
    string license_type = 2;
    int32 page_number = 3;
    int32 page_size = 4;
    string search = 5;
    string order_by = 6;
    string status = 7;
    string role = 8;
}

message GetOrganizationAdminsRequest {
    int32 organization_id = 1;
}

message GetOrganizationUserRequest {
    int32 organization_id = 1;
    string user_id = 2;
}

message OrganizationAdminSummary {
    string user_id = 1;
    string email = 2;
    string full_name = 3;
}

message GetOrganizationAdminsResponse {
    repeated OrganizationAdminSummary admins = 1;
}

message GetOrganizationUsersRequest {
    int32 organization_id = 1;
    bool active_only = 2;
    int32 page_number = 3;
    int32 page_size = 4;
    string role = 5;
    string subscription_order_id = 6;
    string status = 7;
    string search = 8;
    google.protobuf.Int32Value group_id = 9;
}

message GetOrganizationUserByIdRequest {
    string organization_user_id = 1;
}

message GetOrganizationUsersByUserIdRequest {
    string user_id = 1;
    int32 page_number = 2;
    int32 page_size = 3;
}

message OrganizationUserInfo {
    string user_id = 1;
    string email = 2;
    string user_name = 3;
    string full_name = 4;
    string first_name = 5;
    string last_name = 6;
    string last_login_at = 7;

    string organization_user_id = 8;
    int32 organization_id = 9;
    string organization_role = 10;
    string license_type = 11;
    string license_assignment_id = 12;
    bool is_active = 13;
    string joined_at = 14;
    string group_name = 15;
    string group_code = 16;
    string bio = 17;
    string student_date_of_birth = 18;
    string student_major = 19;
    string teacher_specialization = 20;

    repeated SubscriptionInfo subscriptions = 21;
}

message OrganizationUserModel {
    string user_id = 1;
    string organization_user_id = 2;
    int32 organization_id = 3;
}

message SingleOrganizationUserInfo {
    string user_id = 1;
    string email = 2;
    string user_name = 3;
    string full_name = 4;
    string first_name = 5;
    string last_name = 6;
    string last_login_at = 7;

    string organization_user_id = 8;
    int32 organization_id = 9;
    string license_assignment_id = 12;
    bool is_active = 13;
    string joined_at = 14;
    string group_name = 15;
    string group_code = 16;
    string bio = 17;
    string student_date_of_birth = 18;
    string student_major = 19;
    string teacher_specialization = 20;

    repeated SubscriptionInfo subscriptions = 21;
}

message SubscriptionInfo {
    int32 subscription_order_id = 1;
    string license_type = 2;
    string license_assignment_id = 3;
    bool is_active = 4;
    string joined_at = 5;
}

message PagedOrganizationUserList {
    repeated SingleOrganizationUserInfo items = 1;
    int32 total_count = 2;
    int32 page_number = 3;
    int32 page_size = 4;
    int32 total_pages = 5;
}