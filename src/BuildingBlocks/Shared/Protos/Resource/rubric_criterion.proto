syntax = "proto3";

option csharp_namespace = "Shared.Protos.Resource";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";

package resource;

service RubricCriterionService {
    rpc CreateRubricCriterion (CreateRubricCriterionRequest) returns (RubricCriterionResponse) {
        option (google.api.http) = {
            post: "/api/rubric-criterions"
            body: "*"
        };
    }

    rpc GetRubricCriterion (GetRubricCriterionRequest) returns (RubricCriterionResponse) {
        option (google.api.http) = {
            get: "/api/rubric-criterions/{id}"
        };
    }

    rpc UpdateRubricCriterion (UpdateRubricCriterionRequest) returns (RubricCriterionResponse) {
        option (google.api.http) = {
            patch: "/api/rubric-criterions/{id}"
            body: "*"
        };
    }

    rpc DeleteRubricCriterion (DeleteRubricCriterionRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            delete: "/api/rubric-criterions/{id}"
        };
    }

    rpc QueryRubricCriterions (QueryRubricCriterionsRequest) returns (PagedRubricCriterionList) {
        option (google.api.http) = {
            get: "/api/rubric-criterions"
        };
    }
}

message RubricCriterion {
    int32 id = 1;
    int32 assignmentQuestionId = 2;
    string criterionName = 3;
    google.protobuf.StringValue description = 4;
    double maxPoints = 5;
}

message CreateRubricCriterionRequest {
    int32 assignmentQuestionId = 1;
    string criterionName = 2;
    google.protobuf.StringValue description = 3;
    double maxPoints = 4;
}

message UpdateRubricCriterionRequest {
    int32 id = 1;
    string criterionName = 2;
    google.protobuf.StringValue description = 3;
    double maxPoints = 4;
}

message GetRubricCriterionRequest {
    int32 id = 1;
}

message DeleteRubricCriterionRequest {
    int32 id = 1;
}

message RubricCriterionList {
    repeated RubricCriterionResponse rubricCriterions = 1;
}

message PagedRubricCriterionList {
    repeated RubricCriterionResponse items = 1;
    int32 totalCount = 2;
    int32 pageNumber = 3;
    int32 pageSize = 4;
    int32 totalPages = 5;
}

message RubricCriterionResponse {
    int32 id = 1;
    int32 assignmentQuestionId = 2;
    string criterionName = 3;
    google.protobuf.StringValue description = 4;
    double maxPoints = 5;
}

message QueryRubricCriterionsRequest {
    google.protobuf.StringValue search = 1;
    google.protobuf.Int32Value pageNumber = 2;
    google.protobuf.Int32Value pageSize = 3;
    google.protobuf.StringValue orderBy = 4;
    google.protobuf.Int32Value assignmentQuestionId = 5;
}