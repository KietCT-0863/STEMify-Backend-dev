api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: {{ targetPortOrDefault 8086 }}
      transport: auto
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--stemifyhangfire
        value: Host=stemify-postgres;Port=5432;Username=postgres;Password={{ .Env.POSTGRES_PASSWORD }};Database=stemifyhangfire
      - name: connectionstrings--stemifyidentity
        value: Host=stemify-postgres;Port=5432;Username=postgres;Password={{ .Env.POSTGRES_PASSWORD }};Database=stemifyidentity
      - name: connectionstrings--stemifyorder
        value: Host=stemify-postgres;Port=5432;Username=postgres;Password={{ .Env.POSTGRES_PASSWORD }};Database=stemifyorder
  template:
    containers:
      - image: {{ .Image }}
        name: hangfire-api
        env:
          - name: AZURE_CLIENT_ID
            value: {{ if .Env.MANAGED_IDENTITY_CLIENT_ID }}{{ .Env.MANAGED_IDENTITY_CLIENT_ID }}{{ else }}{{ end }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: ConnectionStrings__stemifyhangfire
            secretRef: connectionstrings--stemifyhangfire
          - name: ConnectionStrings__stemifyidentity
            secretRef: connectionstrings--stemifyidentity
          - name: ConnectionStrings__stemifyorder
            secretRef: connectionstrings--stemifyorder
          - name: RabbitMq__Url
            value: {{ if .Env.RABBITMQ_URL }}{{ .Env.RABBITMQ_URL }}{{ else }}{{ end }}
          - name: ASPNETCORE_ENVIRONMENT
            value: Production
          - name: ASPNETCORE_URLS
            value: http://+:{{ targetPortOrDefault 8086 }}
          - name: Kestrel__Endpoints__Http__Protocols
            value: Http1AndHttp2
          - name: Kestrel__Endpoints__Http__Url
            value: http://+:{{ targetPortOrDefault 8086 }}
          - name: ASPNETCORE_HTTP_PORTS
            value: '{{ targetPortOrDefault 8086 }}'
          - name: ASPNETCORE_HTTPS_PORTS
            value: ''
    scale:
      minReplicas: 1
tags:
  azd-service-name: hangfire-api
  aspire-resource-name: hangfire-api

