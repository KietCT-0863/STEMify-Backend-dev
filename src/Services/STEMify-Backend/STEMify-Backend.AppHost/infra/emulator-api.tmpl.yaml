api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: {{ targetPortOrDefault 8089 }}
      transport: auto
      allowInsecure: true
      additionalPortMappings:
        - targetPort: 5009
          exposedPort: 5009
          external: false
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
  template:
    containers:
      - image: {{ .Image }}
        name: emulator-api
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: Production
          - name: ASPNETCORE_HTTP_PORTS
            value: '{{ targetPortOrDefault 8089 }}'
          - name: GRPC_PORT
            value: '5009'
          - name: RabbitMq__Url
            value: {{ if .Env.RABBITMQ_URL }}{{ .Env.RABBITMQ_URL }}{{ else }}{{ end }}
          - name: ConnectionStrings__emulator-mongodb
            value: {{ if .Env.MONGODB_CONNECTION_STRING }}{{ .Env.MONGODB_CONNECTION_STRING }}{{ else }}mongodb://root:mongopw@mongo{{ end }}
          - name: MongoDb__DatabaseName
            value: {{ if .Env.EMULATOR_MONGODB_DATABASE }}{{ .Env.EMULATOR_MONGODB_DATABASE }}{{ else }}stemify_emulator{{ end }}
          - name: RedisConfig__Host
            value: {{ if .Env.REDIS_HOST }}{{ .Env.REDIS_HOST }}{{ else }}localhost{{ end }}
          - name: RedisConfig__Port
            value: {{ if .Env.REDIS_PORT }}{{ .Env.REDIS_PORT }}{{ else }}6379{{ end }}
          - name: RedisConfig__Password
            value: {{ if .Env.REDIS_PASSWORD }}{{ .Env.REDIS_PASSWORD }}{{ else }}{{ end }}
          - name: RedisConfig__Ssl
            value: {{ if .Env.REDIS_SSL }}{{ .Env.REDIS_SSL }}{{ else }}false{{ end }}
          - name: GrpcIdentityUrl
            value: http://identity-api:5083
          - name: GrpcResourceUrl
            value: http://resource-api:5082
          - name: Cloudinary__CloudName
            value: {{ if .Env.CLOUDINARY_CLOUDNAME }}{{ .Env.CLOUDINARY_CLOUDNAME }}{{ else }}{{ end }}
          - name: Cloudinary__ApiKey
            value: {{ if .Env.CLOUDINARY_APIKEY }}{{ .Env.CLOUDINARY_APIKEY }}{{ else }}{{ end }}
          - name: Cloudinary__ApiSecret
            value: {{ if .Env.CLOUDINARY_APISECRET }}{{ .Env.CLOUDINARY_APISECRET }}{{ else }}{{ end }}
          # - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #   value: {{ if .Env.OTEL_EXPORTER_OTLP_ENDPOINT }}{{ .Env.OTEL_EXPORTER_OTLP_ENDPOINT }}{{ else }}http://otelcollector:4317{{ end }}
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_SERVICE_NAME
            value: emulator-service
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: service.name=emulator-service,service.version=1.0.0
        probes:
          - type: Readiness
            httpGet:
              path: /health
              port: {{ targetPortOrDefault 8089 }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          - type: Liveness
            httpGet:
              path: /health
              port: {{ targetPortOrDefault 8089 }}
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
    scale:
      minReplicas: 1
tags:
  azd-service-name: emulator-api
  aspire-resource-name: emulator-api

