api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: {{ targetPortOrDefault 8083 }}
      transport: auto
      allowInsecure: true
      additionalPortMappings:
        - targetPort: 5083
          exposedPort: 5083
          external: false
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--stemifyidentity
        value: Host=stemify-postgres;Port=5432;Username=postgres;Password={{ .Env.POSTGRES_PASSWORD }};Database=stemifyidentity
  template:
    containers:
    - image: {{ .Image }}
      name: identity-api
      env:
      - name: AZURE_CLIENT_ID
        value: {{ if .Env.MANAGED_IDENTITY_CLIENT_ID }}{{ .Env.MANAGED_IDENTITY_CLIENT_ID }}{{ else }}{{ end }}
      - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # - name: HTTP_PORTS
      #   value: '{{ targetPortOrDefault 0 }}'
      - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
        value: "true"
      - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
        value: "true"
      - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
        value: in_memory
      - name: services__identity__http__0
        value: http://identity.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
      - name: services__identity__https__0
        value: https://identity.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
      - name: ConnectionStrings__stemifyidentity
        secretRef: connectionstrings--stemifyidentity
      - name: RabbitMq__Url
        value: {{ if .Env.RABBITMQ_URL }}{{ .Env.RABBITMQ_URL }}{{ else }}{{ end }}
      - name: OpenIddict__Authority
        value: https://identity.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
      - name: ClientApp
        value: {{ if .Env.CLIENT_APP_URL }}{{ .Env.CLIENT_APP_URL }}{{ else }}https://localhost:3000{{ end }}
      - name: EmailSettings__From
        value: {{ if .Env.IDENTITY_EMAIL_FROM }}{{ .Env.IDENTITY_EMAIL_FROM }}{{ else }}{{ end }}
      - name: EmailSettings__DisplayName
        value: {{ if .Env.IDENTITY_EMAIL_DISPLAY_NAME }}{{ .Env.IDENTITY_EMAIL_DISPLAY_NAME }}{{ else }}{{ end }}
      - name: EmailSettings__SMTPServer
        value: {{ if .Env.IDENTITY_EMAIL_SMTP_SERVER }}{{ .Env.IDENTITY_EMAIL_SMTP_SERVER }}{{ else }}{{ end }}
      - name: EmailSettings__Port
        value: {{ if .Env.IDENTITY_EMAIL_PORT }}{{ .Env.IDENTITY_EMAIL_PORT }}{{ else }}{{ end }}
      - name: EmailSettings__Username
        value: {{ if .Env.IDENTITY_EMAIL_USERNAME }}{{ .Env.IDENTITY_EMAIL_USERNAME }}{{ else }}{{ end }}
      - name: EmailSettings__Password
        value: {{ if .Env.IDENTITY_EMAIL_PASSWORD }}{{ .Env.IDENTITY_EMAIL_PASSWORD }}{{ else }}{{ end }}
      - name: EmailSettings__UseSSL
        value: {{ if .Env.IDENTITY_EMAIL_USE_SSL }}{{ .Env.IDENTITY_EMAIL_USE_SSL }}{{ else }}{{ end }}
      - name: EmailSettings__ApplicationName
        value: {{ if .Env.IDENTITY_EMAIL_APP_NAME }}{{ .Env.IDENTITY_EMAIL_APP_NAME }}{{ else }}{{ end }}
      - name: EmailSettings__SupportEmail
        value: {{ if .Env.IDENTITY_EMAIL_SUPPORT }}{{ .Env.IDENTITY_EMAIL_SUPPORT }}{{ else }}{{ end }}
      - name: Authentication__Google__ClientId
        value: {{ if .Env.GOOGLE_CLIENT_ID }}{{ .Env.GOOGLE_CLIENT_ID }}{{ else }}{{ end }}
      - name: Authentication__Google__ClientSecret
        value: {{ if .Env.GOOGLE_CLIENT_SECRET }}{{ .Env.GOOGLE_CLIENT_SECRET }}{{ else }}{{ end }}
      - name: Authentication__Google__RedirectUri
        value: https://apigateway.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}/api/auth/google/callback
      - name: GrpcServices__OrderService__Address
        value: http://order-api:5085
      - name: BackendUrl
        value: https://apigateway.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}/
      - name: ASPNETCORE_HTTP_PORTS
        value: '{{ targetPortOrDefault 8083 }}'
      - name: GRPC_PORT
        value: '5083'
      - name: ASPNETCORE_HTTPS_PORTS
        value: ''
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
        # Add health probes to ensure proper startup order
        # probes:
        #   - type: Startup
        #     httpGet:
        #       path: "/health/ready"
        #       port: {{ targetPortOrDefault 8080 }}
        #     initialDelaySeconds: 60
        #     periodSeconds: 10
        #     timeoutSeconds: 5
        #     failureThreshold: 90
        #   - type: Readiness
        #     httpGet:
        #       path: "/health/ready"
        #       port: {{ targetPortOrDefault 8080 }}
        #     initialDelaySeconds: 30
        #     periodSeconds: 5
        #     timeoutSeconds: 5
        #     failureThreshold: 24
        #   - type: Liveness
        #     httpGet:
        #       path: "/health"
        #       port: {{ targetPortOrDefault 8080 }}
        #     initialDelaySeconds: 60
        #     periodSeconds: 30
        #     timeoutSeconds: 5
        #     failureThreshold: 3
    scale:
      minReplicas: 1
tags:
  azd-service-name: identity-api
  aspire-resource-name: identity-api
