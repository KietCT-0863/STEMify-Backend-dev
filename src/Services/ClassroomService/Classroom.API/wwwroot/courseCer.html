<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UCI Course Certificate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: white;
            padding: 0;
            margin: 0;
            width: 374mm;
            height: 264mm;
        }

        .certificate {
            width: 374mm;
            height: 264mm;
            background: white;
            position: relative;
            border: 12px solid #d0d0d0;
            overflow: visible;
        }

        .inner-border {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 4px solid #a0a0a0;
            pointer-events: none;
            z-index: 1;
        }

        .corner-ornament {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 2px solid #a0a0a0;
            z-index: 2;
        }

            .corner-ornament.top-left {
                top: 18px;
                left: 18px;
                border-right: none;
                border-bottom: none;
            }

            .corner-ornament.top-right {
                top: 18px;
                right: 18px;
                border-left: none;
                border-bottom: none;
            }

            .corner-ornament.bottom-left {
                bottom: 18px;
                left: 18px;
                border-right: none;
                border-top: none;
            }

            .corner-ornament.bottom-right {
                bottom: 18px;
                right: 18px;
                border-left: none;
                border-top: none;
            }

        .header {
            display: block;
            padding: 50px 75px 25px;
            position: relative;
            height: 170px;
            z-index: 3;
        }

        .logo-section {
            float: left;
            width: 375px;
        }

            .logo-section img {
                width: 200px;
                height: auto;
                margin-bottom: 6px;
                display: block;
            }

        .main-content {
            padding: 0 75px;
            text-align: left;
            clear: both;
            position: relative;
            z-index: 3;
        }

        .date {
            font-size: 17px;
            color: #666;
            margin-bottom: 37px;
        }

        .recipient-name {
            font-size: 45px;
            color: #333;
            margin-bottom: 37px;
            font-weight: normal;
        }

        .completion-text {
            font-size: 17px;
            color: #666;
            margin-bottom: 25px;
        }

        .course-title {
            font-size: 30px;
            color: #333;
            margin-bottom: 37px;
            font-weight: normal;
        }

        .course-description {
            font-size: 15px;
            color: #666;
            line-height: 1.4;
            margin-bottom: 50px;
            max-width: 625px;
        }

        .bottom-section {
            position: absolute;
            bottom: 37px;
            left: 0;
            right: 0;
            height: 100px;
            z-index: 3;
        }

        .signature-section {
            display: block;
            padding: 0 75px;
            position: relative;
        }

        .signature-container {
            float: left;
            width: 310px;
        }

        .signature-line {
            width: 250px;
            height: 50px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40"><path d="M10 30 Q50 10 90 25 Q130 40 170 20" stroke="%23333" stroke-width="2" fill="none"/></svg>') no-repeat;
            background-size: 100% 100%;
            margin-bottom: 12px;
        }

        .signature-info {
            font-size: 14px;
            color: #666;
            line-height: 1.3;
        }

        .certificate-type {
            position: absolute;
            right: 275px;
            bottom: -12px;
            text-align: right;
            font-size: 20px;
            color: #666;
            letter-spacing: 3px;
            line-height: 1.4;
        }

        /* Badge ribbon - SVG approach for PDF compatibility */
        .badge {
            position: absolute;
            top: 50px;
            right: 75px;
            width: 175px;
            height: 400px;
            z-index: 10;
        }

        .badge-content {
            text-align: center;
            padding-top: 37px;
            position: absolute;
            top: 0;
            left: 0;
            width: 175px;
            z-index: 11;
        }

        .badge-circle {
            width: 125px;
            height: 125px;
            border: 2px solid #666;
            border-radius: 50%;
            background: white;
            margin: 0 auto;
            position: relative;
        }

        .badge-circle-inner {
            width: 106px;
            height: 106px;
            border: 1px dashed #666;
            border-radius: 50%;
            position: absolute;
            top: 9.5px;
            left: 9.5px;
        }

        .coursera-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            line-height: 125px;
            position: relative;
            z-index: 12;
        }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="inner-border"></div>
        <div class="corner-ornament top-left"></div>
        <div class="corner-ornament top-right"></div>
        <div class="corner-ornament bottom-left"></div>
        <div class="corner-ornament bottom-right"></div>

        <!-- Badge ribbon - SVG for PDF compatibility -->
        <div class="badge">
            <svg width="175" height="400" viewBox="0 0 140 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#e8e8f0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d5d5e5;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <!-- Ribbon shape with V-cut bottom -->
                <polygon points="0,0 140,0 140,280 70,320 0,280" fill="url(#ribbonGradient)" />
            </svg>

            <div class="badge-content">
                <div class="badge-circle">
                    <div class="badge-circle-inner"></div>
                    <div class="coursera-text">Stemify</div>
                </div>
            </div>
        </div>

        <div class="header">
            <div class="logo-section">
                <img src="https://www.stemifi.com/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Flogo.5cb4d7f9.png&w=640&q=75"
                     alt="Stemify Logo" />
            </div>
        </div>

        <div class="main-content">
            <div class="date">{{issueDate}}</div>
            <div class="recipient-name">{{recipientName}}</div>
            <div class="completion-text">has successfully completed</div>
            <div class="course-title">{{courseTitle}}</div>
            <div class="course-description">{{courseDescription}}</div>
        </div>

        <div class="bottom-section">
            <div class="signature-section">
                <div class="signature-container">
                    <div class="signature-line"></div>
                    <div class="signature-info">
                        STEMify<br />
                        Instructor
                    </div>
                </div>
                <div class="certificate-type">COURSE<br />CERTIFICATE</div>
            </div>
        </div>
    </div>
</body>
</html>
