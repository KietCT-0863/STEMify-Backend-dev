name: Pre-checks

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the project file
        required: true
        type: string
      tests-path:
        description: Path to the tests directory
        required: true
        type: string
      dotnet-version:
        description: Dotnet version to use
        required: true
        type: string
    secrets:
      CI_GITHUB_TOKEN:
        description: GitHub token with repo scope
        required: true

jobs:
  pre-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Conventional Commits Check
        if: ${{ github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@v5
        id: check-pull-request
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Job Info
        if: success()
        shell: bash
        env:
          GITHUB_WORKSPACE_SAFE: ${{ github.workspace }}
          IS_WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IS_PUSH_EVENT: ${{ github.event_name == 'push' }}
          IS_PR_EVENT: ${{ github.event_name == 'pull_request' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME_SAFE: ${{ github.ref_name }}
          GITHUB_REF_SAFE: ${{ github.ref }}
          GITHUB_HEAD_REF_SAFE: ${{ github.head_ref }}
        run: |
          set -eu
          echo "pre-check is successful."
          printf '%s\n' "environment is: ${GITHUB_WORKSPACE_SAFE}"
          printf '%s\n' "is workflow_dispatch event? ${IS_WORKFLOW_DISPATCH}"
          printf '%s\n' "is push event? ${IS_PUSH_EVENT}"
          printf '%s\n' "is pull request event? ${IS_PR_EVENT}"
          printf '%s\n' "pull_request.head.ref is: ${PR_HEAD_REF}"
          printf '%s\n' "github.ref_name is: ${GITHUB_REF_NAME_SAFE}"
          printf '%s\n' "github.ref is: ${GITHUB_REF_SAFE}"
          printf '%s\n' "github.head_ref is: ${GITHUB_HEAD_REF_SAFE}"

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore .NET Tools
        shell: bash
        run: dotnet tool restore

      - name: Install CSharpier Tool
        shell: bash
        run: |
          echo "Installing CSharpier"
          dotnet tool install --global csharpier --version 1.0.2
          echo "Adding CSharpier to PATH"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH


      - name: Format code with CSharpier
        shell: bash
        run: |
          echo "🧹 Checking format in folder: ${{ inputs.project-path }}"
          csharpier check ${{ inputs.project-path }}
          echo "🧹 Checking format in folder: ${{ inputs.tests-path }}"
          csharpier check ${{ inputs.tests-path }}

      # - name: Auto-commit formatted files
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: "chore(format): apply CSharpier formatting"
      #     branch: ${{ github.head_ref || github.ref_name }}


      - name: Run Style Task
        if: success()
        shell: bash
        id: style
        run: |
          echo "🎨 Checking style in folder: ${{ inputs.project-path }}"
          find ${{ inputs.project-path }} -name "*.csproj" -exec dotnet format style {} --verify-no-changes --severity error --verbosity diagnostic \;
          echo "🎨 Checking style in folder: ${{ inputs.tests-path }}"
          find ${{ inputs.tests-path }} -name "*.csproj" -exec dotnet format style {} --verify-no-changes --severity error --verbosity diagnostic \;

      - name: Run Analyzers Task
        if: success()
        shell: bash
        run: |
          echo "📂 Running analyzers in folder: ${{ inputs.project-path }}"
          find ${{ inputs.project-path }} -name "*.csproj" -exec dotnet format analyzers {} --verify-no-changes --severity error --verbosity diagnostic \;
          echo "📂 Running analyzers in folder: ${{ inputs.tests-path }}"
          find ${{ inputs.tests-path }} -name "*.csproj" -exec dotnet format analyzers {} --verify-no-changes --severity error --verbosity diagnostic \;

      - name: Run Build Task
        if: success()
        shell: bash
        run: |
          echo "📂 Running build for all csproj in: ${{ inputs.project-path }}" find ${{ inputs.project-path }} -name "*.csproj" -exec dotnet build {} --verbosity diagnostic \;
