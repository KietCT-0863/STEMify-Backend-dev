name: identity-ci-cd

on:
  push:
    branches: [ main ]
#     paths:
#       - src/Services/Identity/**
#       - tests/Identity/**
#       - .github/workflows/identity-ci-cd.yml   # khi workflow sửa
#   pull_request:
#     branches: [main]

permissions:
  pull-requests: write
  contents: read
  
env:
  REGISTRY: ${{ secrets.ACR_REGISTRY_URL }}

jobs:
# ───────────────────────────────────────────── QUALITY CHECK ──────────────────
  pre-checks:
    uses: ./.github/workflows/_pre-checks.yml
    with:
      project-path: src/Services/Identity
      tests-path: tests/Identity
      dotnet-version: '8.0.x'
    secrets:
      CI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ───────────────────────────────────────────── VERSIONING ─────────────────────
  version:
    needs: pre-checks
    uses: ./.github/workflows/_semantic-version.yml
    with:
      environment: development       # ↔ staging / production tuỳ branch
      dotnet-version: '8.0.x'

# ───────────────────────────────────────────── BUILD & PUSH ───────────────────
  build-push:
    needs: [pre-checks, version]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: identity-web
            dockerfile: src/Services/Identity/Identity.Web/Dockerfile
            csproj: src/Services/Identity/Identity.Web/Identity.Web.csproj
          - name: identity-api
            dockerfile: src/Services/Identity/Identity.API/Dockerfile
            csproj: src/Services/Identity/Identity.API/Identity.API.csproj

    env:
      IMAGE_NAME: ${{ secrets.ACR_REGISTRY_URL }}/${{ matrix.name }}
      IMAGE_TAG: ${{ needs.version.outputs.image-version }}

    steps:
      - uses: actions/checkout@v4

      # Build & unit-test (bảo đảm compile OK trước khi đóng gói)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ matrix.csproj }}

      - name: Build
        run: dotnet build ${{ matrix.csproj }} -c Release --no-restore

      # test domain
      # - name: Run Domain Tests
      #   run: dotnet test tests/Identity/Domain.UnitTests/Domain.UnitTests.csproj -c Release

      # Login ACR
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Summary
        run: |
          echo " Pushed:"
          echo " - ${{ env.IMAGE_NAME }}:latest"
          echo " - ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"