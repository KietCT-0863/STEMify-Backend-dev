receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  memory_limiter:
    limit_mib: 512
    check_interval: 5s
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert

exporters:
  debug:
    verbosity: detailed
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "stemify"
    const_labels:
      environment: "production"
  prometheusremotewrite:
    endpoint: ${env:PROMETHEUS_ENDPOINT}
    tls:
      insecure: true
  
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch, memory_limiter, resource]
      exporters:
        - prometheus
        - prometheusremotewrite
        - debug
