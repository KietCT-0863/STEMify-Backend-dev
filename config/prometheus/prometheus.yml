global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'stemify-cluster'
    environment: 'development'

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otelcollector:8888']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # .NET Services via OpenTelemetry
  - job_name: 'dotnet-services'
    static_configs:
      - targets: ['otelcollector:8889']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # API Gateway
  - job_name: 'apigateway'
    static_configs:
      - targets: ['host.docker.internal:6002']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 15s

  # Identity Service
  - job_name: 'identity'
    static_configs:
      - targets: ['host.docker.internal:7002']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 15s

  # Classroom Service
  - job_name: 'classroom'
    static_configs:
      - targets: ['host.docker.internal:5001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Resource Service
  - job_name: 'resource'
    static_configs:
      - targets: ['host.docker.internal:5003']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Product Service
  - job_name: 'product'
    static_configs:
      - targets: ['host.docker.internal:5005']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Order Service
  - job_name: 'order'
    static_configs:
      - targets: ['host.docker.internal:5006']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Payment Service
  - job_name: 'payment'
    static_configs:
      - targets: ['host.docker.internal:7230']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 15s

  # Cart Service
  - job_name: 'cart'
    static_configs:
      - targets: ['host.docker.internal:5184']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Notification Service
  - job_name: 'notification'
    static_configs:
      - targets: ['host.docker.internal:5086']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Emulator Service
  - job_name: 'emulator'
    static_configs:
      - targets: ['host.docker.internal:5062']
    metrics_path: '/metrics'
    scrape_interval: 15s

# Storage configuration for out-of-order ingestion
storage:
  tsdb:
    out_of_order_time_window: 30m